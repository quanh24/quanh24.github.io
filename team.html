<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chia đội ngẫu nhiên</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: sans-serif;
            font-size: 15px;
            background-color: #f4f6f8;
            color: #222;
            display: flex;
            flex-direction: column;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        /* ---------- Thanh điều khiển ---------- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 16px;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
        }

        .toolbar h1 {
            font-size: 18px;
            margin: 0 10px 0 0;
            white-space: nowrap;
        }

        .segmented {
            display: inline-flex;
            border: 1px solid #4CAF50;
            border-radius: 8px;
            overflow: hidden;
        }

        .segmented button {
            border: none;
            background: #fff;
            color: #4CAF50;
            padding: 7px 12px;
            cursor: pointer;
        }

        .segmented button.active {
            background-color: #4CAF50;
            color: #fff;
            font-weight: bold;
        }

        .toolbar input[type=number] {
            width: 70px;
            padding: 7px 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .spacer {
            flex: 1;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: bold;
            color: #fff;
            background-color: #4CAF50;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            filter: brightness(0.92);
        }

        .btn.blue {
            background-color: #2196F3;
        }

        .btn.red {
            background-color: #f44336;
        }

        .btn.small {
            padding: 4px 10px;
            font-size: 13px;
        }

        /* ---------- 3 cột ---------- */
        .main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(180px, 1fr) minmax(220px, 1.2fr) minmax(280px, 2fr);
            gap: 12px;
            padding: 12px 16px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
        }

        .panel-header .hint {
            font-weight: normal;
            color: #888;
            font-size: 13px;
        }

        .panel-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px 12px;
        }

        #memberList {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            padding: 10px 12px;
            line-height: 1.5;
        }

        /* ---------- Tier ---------- */
        .tier-box {
            border: 1px solid #ddd;
            border-left: 4px solid #2196F3;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .tier-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px 4px 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .tier-header .count {
            color: #888;
            font-weight: normal;
        }

        .tier-header .remove {
            border: none;
            background: none;
            color: #f44336;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }

        .tier-box textarea {
            display: block;
            width: 100%;
            border: none;
            border-top: 1px solid #eee;
            outline: none;
            resize: vertical;
            padding: 6px 10px;
            line-height: 1.5;
        }

        .empty {
            color: #999;
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
        }

        /* ---------- Kết quả ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
            background-color: #fff;
        }

        .team-box {
            background-color: #f1f8f1;
            border: 1px solid #cfe5cf;
            border-radius: 8px;
            padding: 8px 12px;
        }

        .team-box h4 {
            margin: 0 0 6px;
            display: flex;
            justify-content: space-between;
        }

        .team-box h4 span {
            color: #888;
            font-weight: normal;
            font-size: 13px;
        }

        .team-box ul {
            margin: 0;
            padding-left: 18px;
            line-height: 1.6;
        }

        .tier {
            display: inline-block;
            margin-left: 6px;
            padding: 0 7px;
            border-radius: 10px;
            background-color: #2196F3;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        /* ---------- Mobile: xếp dọc, cuộn cả trang ---------- */
        @media (max-width: 800px) {
            body {
                height: auto;
            }

            .main {
                grid-template-columns: 1fr;
            }

            #memberList {
                min-height: 180px;
            }

            .panel-body {
                overflow: visible;
            }
        }
    </style>
</head>

<body>

    <div class="toolbar">
        <h1>🧑‍🤝‍🧑 Chia đội</h1>

        <div class="segmented">
            <button id="modeTeamCount" onclick="setMode('teamCount')">Số đội</button>
            <button id="modeMembersPerTeam" onclick="setMode('membersPerTeam')">Người / đội</button>
        </div>
        <input type="number" id="numTeams" min="1" placeholder="3" title="Số đội">
        <input type="number" id="numMembersPerTeam" min="1" placeholder="4" title="Số người mỗi đội">

        <div class="spacer"></div>

        <button class="btn" onclick="autoDivideTeams()" title="Ctrl + Enter">🎲 Chia đội</button>
        <button class="btn blue" onclick="copyAsImage()">📷 Copy ảnh</button>
        <button class="btn red" onclick="resetForm()">🔄 Reset</button>
    </div>

    <div class="main">
        <div class="panel">
            <div class="panel-header">
                Thành viên <span class="hint" id="memberCount">0 người</span>
            </div>
            <textarea id="memberList" oninput="updateCounts()" placeholder="Mỗi dòng 1 tên
Nam
Lan
Hùng
..."></textarea>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>Tier <span class="hint">cùng tier → khác đội</span></span>
                <button class="btn blue small" onclick="addTier()">➕ Thêm</button>
            </div>
            <div class="panel-body">
                <div id="tierList"></div>
                <div class="empty" id="tierEmpty">Chưa có tier nào.<br>Bấm ➕ Thêm để tạo.</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                Kết quả <span class="hint" id="resultInfo"></span>
            </div>
            <div class="panel-body">
                <div id="result" class="grid"></div>
                <div class="empty" id="resultEmpty">Bấm 🎲 Chia đội (Ctrl + Enter) để xem kết quả.</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
        let mode = 'teamCount';

        function setMode(m) {
            mode = m;
            document.getElementById('modeTeamCount').classList.toggle('active', m === 'teamCount');
            document.getElementById('modeMembersPerTeam').classList.toggle('active', m === 'membersPerTeam');
            document.getElementById('numTeams').style.display = (m === 'teamCount') ? '' : 'none';
            document.getElementById('numMembersPerTeam').style.display = (m === 'membersPerTeam') ? '' : 'none';
            localStorage.setItem('divideMode', m);
        }

        window.onload = () => {
            document.getElementById('memberList').value = localStorage.getItem('memberList') || '';
            document.getElementById('numTeams').value = localStorage.getItem('numTeams') || '';
            document.getElementById('numMembersPerTeam').value = localStorage.getItem('numMembersPerTeam') || '';
            let tiers = [];
            try { tiers = JSON.parse(localStorage.getItem('tierList')) || []; } catch (e) { }
            tiers.forEach(addTier);
            setMode(localStorage.getItem('divideMode') || 'teamCount');
            updateCounts();
        };

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                autoDivideTeams();
            }
        });

        function saveInputs() {
            localStorage.setItem('memberList', document.getElementById('memberList').value);
            localStorage.setItem('numTeams', document.getElementById('numTeams').value);
            localStorage.setItem('numMembersPerTeam', document.getElementById('numMembersPerTeam').value);
            localStorage.setItem('tierList', JSON.stringify(getTierTextareas().map(t => t.value)));
        }

        function getTierTextareas() {
            return [...document.querySelectorAll('#tierList textarea')];
        }

        function updateCounts() {
            document.getElementById('memberCount').textContent =
                `${splitLines(document.getElementById('memberList').value).length} người`;
            document.querySelectorAll('#tierList .tier-box').forEach((box, i) => {
                box.querySelector('.tier-title').textContent = `Tier ${i + 1}`;
                box.querySelector('.count').textContent = `· ${splitLines(box.querySelector('textarea').value).length} người`;
            });
            document.getElementById('tierEmpty').style.display =
                document.querySelector('#tierList .tier-box') ? 'none' : '';
        }

        function addTier(value) {
            const box = document.createElement('div');
            box.className = 'tier-box';
            box.innerHTML = `
                <div class="tier-header">
                    <span><span class="tier-title"></span> <span class="count"></span></span>
                    <button class="remove" title="Xóa tier" onclick="removeTier(this)">×</button>
                </div>
                <textarea rows="3" placeholder="Mỗi dòng 1 tên" oninput="updateCounts()"></textarea>`;
            const ta = box.querySelector('textarea');
            ta.value = typeof value === 'string' ? value : '';
            document.getElementById('tierList').appendChild(box);
            updateCounts();
            if (typeof value !== 'string') ta.focus();
        }

        function removeTier(btn) {
            btn.closest('.tier-box').remove();
            updateCounts();
            saveInputs();
        }

        function splitLines(text) {
            return text.split('\n').map(x => x.trim()).filter(x => x);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Gom thành viên từ các ô tier + danh sách chung; tên đã có trong tier thì bỏ qua ở danh sách chung
        function collectMembers() {
            const members = [];
            const tiered = new Set();
            getTierTextareas().forEach((ta, i) => {
                splitLines(ta.value).forEach(name => {
                    if (tiered.has(name)) return;
                    tiered.add(name);
                    members.push({ name, tier: String(i + 1) });
                });
            });
            splitLines(document.getElementById('memberList').value).forEach(name => {
                if (!tiered.has(name)) members.push({ name, tier: '' });
            });
            return members;
        }

        // Chia người cùng tier rải đều sang các đội khác nhau, giữ sĩ số các đội cân bằng
        function divideByTier(members, numTeams, capacity) {
            const teams = Array.from({ length: numTeams }, () => []);
            const tierCount = Array.from({ length: numTeams }, () => ({}));

            const groups = {};
            members.forEach(m => (groups[m.tier] = groups[m.tier] || []).push(m));

            // Xếp các tier trước, người không có tier xếp sau cùng để bù sĩ số
            const tierKeys = Object.keys(groups).filter(t => t).sort((a, b) => a.localeCompare(b, 'vi', { numeric: true }));
            if (groups['']) tierKeys.push('');

            tierKeys.forEach(tier => {
                const group = groups[tier];
                shuffle(group);
                group.forEach(m => {
                    const candidates = teams
                        .map((team, i) => i)
                        .filter(i => teams[i].length < capacity);
                    shuffle(candidates);
                    candidates.sort((a, b) =>
                        ((tierCount[a][tier] || 0) - (tierCount[b][tier] || 0)) ||
                        (teams[a].length - teams[b].length));
                    const i = candidates[0];
                    teams[i].push(m);
                    tierCount[i][tier] = (tierCount[i][tier] || 0) + 1;
                });
            });

            return teams;
        }

        function autoDivideTeams() {
            saveInputs();
            const members = collectMembers();
            if (members.length === 0) {
                alert("⚠️ Vui lòng nhập danh sách thành viên.");
                return;
            }

            let teams = [];

            if (mode === 'teamCount') {
                const numTeams = parseInt(document.getElementById('numTeams').value);
                if (!numTeams || numTeams < 1) {
                    alert("⚠️ Vui lòng nhập số đội hợp lệ.");
                    document.getElementById('numTeams').focus();
                    return;
                }

                if (members.length < numTeams) {
                    alert("⚠️ Số người ít hơn số đội!");
                    return;
                }

                teams = divideByTier(members, numTeams, Math.ceil(members.length / numTeams));

            } else {
                const numPerTeam = parseInt(document.getElementById('numMembersPerTeam').value);
                if (!numPerTeam || numPerTeam < 1) {
                    alert("⚠️ Vui lòng nhập số người mỗi đội hợp lệ.");
                    document.getElementById('numMembersPerTeam').focus();
                    return;
                }

                const totalTeams = Math.ceil(members.length / numPerTeam);
                teams = divideByTier(members, totalTeams, numPerTeam);
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "";
            teams.forEach((team, i) => {
                const box = document.createElement("div");
                box.className = "team-box";
                const items = team.map(m =>
                    `<li>${escapeHtml(m.name)}${m.tier ? `<span class="tier">${escapeHtml(m.tier)}</span>` : ''}</li>`);
                box.innerHTML = `<h4>Đội ${i + 1} <span>${team.length} người</span></h4><ul>${items.join('')}</ul>`;
                resultDiv.appendChild(box);
            });

            document.getElementById('resultEmpty').style.display = 'none';
            document.getElementById('resultInfo').textContent = `${members.length} người · ${teams.length} đội`;
        }

        function copyAsImage() {
            const node = document.getElementById('result');
            if (!node.innerHTML.trim()) {
                alert("⚠️ Chưa có nội dung để chụp.");
                return;
            }

            html2canvas(node).then(canvas => {
                canvas.toBlob(blob => {
                    const item = new ClipboardItem({ "image/png": blob });
                    navigator.clipboard.write([item]);
                    alert("📷 Đã sao chép ảnh vào clipboard!");
                });
            });
        }

        function resetForm() {
            if (confirm("Bạn có chắc muốn xóa toàn bộ nội dung và dữ liệu đã lưu?")) {
                document.getElementById('numTeams').value = '';
                document.getElementById('numMembersPerTeam').value = '';
                document.getElementById('memberList').value = '';
                document.getElementById('tierList').innerHTML = '';
                document.getElementById('result').innerHTML = '';
                document.getElementById('resultEmpty').style.display = '';
                document.getElementById('resultInfo').textContent = '';
                updateCounts();
                localStorage.removeItem('numTeams');
                localStorage.removeItem('numMembersPerTeam');
                localStorage.removeItem('memberList');
                localStorage.removeItem('tierList');
            }
        }
    </script>

</body>

</html>
